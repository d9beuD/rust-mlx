[package]
name = "rust-mlx"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Measured Rust inference and Metal kernels for Apple Silicon"

[dependencies]
mlx-rs = { version = "=0.32.0", features = ["safetensors"] }
mlx-sys = "=0.6.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
half = "2"
memmap2 = "0.9"
axum = "0.8.9"
tokio-stream = "0.1"
minijinja = { version = "2.24.0", features = ["json"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["."]
resolver = "3"
